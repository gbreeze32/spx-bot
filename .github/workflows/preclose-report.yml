name: SPX pre-close report

on:
  schedule:
    # 19:10 and 20:10 UTC Mon-Fri = 15:10 ET in summer or winter time. The report is written, then sent at 15:30 ET (12:30 PM PT).
    - cron: "10 19,20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, even outside the normal time (test)"
        type: boolean
        default: true

permissions:
  contents: write   # lets the bot save the report page to docs/

concurrency:
  group: report-pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py preclose
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
