name: SPX 30-min updates

on:
  schedule:
    # Every 30 min Mon-Fri, 13:00-21:30 UTC. The script only sends 9:30-16:00 ET.
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, even outside the normal time (test)"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py update
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
