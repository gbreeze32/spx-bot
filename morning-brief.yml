name: SPX morning report

on:
  schedule:
    # 13:05 and 14:05 UTC Mon-Fri = 9:05 ET in summer or winter time. The report is written, then sent at 9:21 ET (6:21 AM PT).
    - cron: "5 13,14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, even outside the normal time (test)"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py morning
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
